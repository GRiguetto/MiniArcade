<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mini Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      try {
        var t = localStorage.getItem("arcade:tema");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="barra">
      <button
        class="btn"
        id="tema"
        aria-label="Alternar tema claro/escuro"
      ></button>
    </div>

    <h1>MINI ARCADE</h1>
    <p class="sub">ESCOLHA SEU JOGO</p>

    <main id="menu">
      <div class="grade" id="grade"></div>
      <p class="sub piscar" style="margin-top: 28px">PRESSIONE UM CARTUCHO</p>
    </main>

    <section id="jogo" hidden>
      <div class="topo">
        <button class="btn" id="voltar">◀ MENU</button>
        <span id="titulo-jogo"></span>
      </div>
      <div id="palco"></div>
    </section>

    <footer>© 2026 MINI ARCADE · FEITO COM HTML, CSS E JS</footer>

    <script src="js/sound.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/games/cobrinha.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
